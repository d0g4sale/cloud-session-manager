<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sky-blue background gradient for the macOS-style rounded tile. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E9BFF"/>
      <stop offset="1" stop-color="#1E5FD8"/>
    </linearGradient>
    <!-- Subtle vertical shading on the white cloud so it isn't flat. -->
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3EEFF"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0A2A66" flood-opacity="0.35"/>
    </filter>
    <filter id="cloudShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0A2A66" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- macOS icon grid: rounded tile inset from the 1024 canvas with a shadow. -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185"
        fill="url(#bg)" filter="url(#tileShadow)"/>

  <!-- White cloud, built from overlapping shapes (they union under the default
       nonzero fill rule). -->
  <g filter="url(#cloudShadow)">
    <g fill="url(#cloud)">
      <ellipse cx="512" cy="452" rx="158" ry="128"/>
      <circle cx="372" cy="540" r="98"/>
      <circle cx="648" cy="540" r="110"/>
      <rect x="352" y="512" width="320" height="128" rx="64"/>
    </g>
  </g>

  <!-- Keyhole on the cloud: circle + tapered stem in deep blue. -->
  <g fill="#12439E">
    <circle cx="512" cy="498" r="50"/>
    <path d="M 490 520 L 534 520 L 552 618 Q 554 638 534 638 L 490 638 Q 470 638 472 618 Z"/>
  </g>
</svg>
