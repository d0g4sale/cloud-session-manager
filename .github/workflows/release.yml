name: Build, Sign & Notarize

on:
  push:
    branches: ["main"]    # CI build on every commit to main
    tags: ["v*"]          # full sign+notarize release: `git tag v1.0 && git push --tags`
  workflow_dispatch: {}   # or run manually from the Actions tab

# Shared across jobs.
env:
  PROJECT: cloud-session-manager.xcodeproj
  SCHEME: cloud-session-manager
  APP_NAME: cloud-session-manager
  TEAM_ID: MKTMGKS2F9

jobs:
  # --- Fast, unsigned compile check for main / manual runs (no secrets needed) ---
  ci-build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # Use the newest stable Xcode the runner image ships. This auto-tracks
      # runner updates instead of pinning a version that may not be installed.
      # The project's deployment target must be <= the SDK this Xcode provides.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version

      # Build without code signing — verifies main compiles, no certs/notary needed.
      - name: Build
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  # --- Full Developer ID sign + notarize + release, tags only ---
  # Delegates to the reusable pipeline so the signing steps live in one place.
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
