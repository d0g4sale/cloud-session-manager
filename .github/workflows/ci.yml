name: CI

# Build and test on every push to main and on pull requests targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Run tests
        run: ./run-tests.sh

      - name: Assemble app bundle
        # A commit-derived version so CI-built bundles are traceable, without
        # implying a real release (that only happens in release.yml).
        env:
          APP_VERSION: 0.0.0-dev
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./build-app.sh
